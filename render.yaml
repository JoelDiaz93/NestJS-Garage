services:
  - type: web
    name: garageflow-portfolio-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGIN
        value: https://garageflow-portfolio-app.onrender.com
      - key: SWAGGER_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_SYNC
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: TAX_RATE
        value: "0.15"
      - key: QUOTE_VALIDITY_DAYS
        value: "15"
      - key: MEDIA_STORAGE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@garageflow.local
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: garageflow-portfolio-app
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://garageflow-portfolio-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://garageflow-portfolio-api.onrender.com/workshop
      - key: VITE_DEMO_EMAIL
        value: admin@garageflow.local
      - key: VITE_FREE_HOSTING
        value: "true"
